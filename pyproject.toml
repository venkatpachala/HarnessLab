[project]
name = "harnesslab"
version = "0.1.0"
description = "Controlled experimentation platform for AI agent harnesses"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pytest>=8.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
harnesslab = "harnesslab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["harnesslab*"]
