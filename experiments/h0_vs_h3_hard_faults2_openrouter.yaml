name: h0_vs_h3_hard_faults2_openrouter

# Same timeout×2 cell, any OpenRouter slug.
# Set OPENROUTER_API_KEY. Change model.name to whatever you want:
#   openai/gpt-4o-mini
#   anthropic/claude-3.5-sonnet
#   qwen/qwen-2.5-7b-instruct
#   meta-llama/llama-3.3-70b-instruct
#   x-ai/grok-4
#   google/gemini-2.0-flash-001
#   openrouter/auto
model:
  provider: openrouter
  name: stealth/ox-alpha
  temperature: 0
  base_url: https://openrouter.ai/api/v1

environment:
  name: commerce_world
  fixture: hard_001
  faults:
    - tool: refund_payment
      type: timeout
      fail_times: 2

harnesses:
  - name: direct
  - name: recovery
    params:
      max_retries: 2

tasks:
  dataset: commerce_v1
  ids:
    - refund_alice_not_alicia
    - refund_older_mug_not_latest
    - refuse_cancelled_order
    - refuse_bob_processing_named
    - refund_both_alice_delivered
    - refund_and_resolve_t1
    - policy_then_refuse_processing
    - conflicting_refund_both_customers
    - dual_refund_baseline
    - resolve_t1_only_no_refund

budget:
  max_steps: 16
  max_tokens: 80000
  max_cost_usd: 8.0

repetitions: 1
seed: 0
output_dir: runs